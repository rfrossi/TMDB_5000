[project]
name = "tmdb-5000"
version = "0.1.0"
description = "Movie data analysis using TMDB 5000 dataset"
authors = [
    {name = "rfrossi"}
]
requires-python = "^3.13"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.28.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=7.0.0",
    "plotly (>=6.6.0,<7.0.0)",
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
